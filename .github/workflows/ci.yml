name: CI

# Threat matrix (CI workflow trust): `pull_request` only, never
# `pull_request_target` -- a fork PR's workflow runs with no repository
# secrets and read-only permissions, so a modified workflow in the PR
# itself cannot exfiltrate anything or write back to the repository.
on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    # A hung step would otherwise hold the runner for the 360-minute
    # default; the job itself takes about 20 s (issue #35: R4-ci-no-job-
    # timeout, from #29).
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm validate

      - run: pnpm test

      - run: pnpm build
