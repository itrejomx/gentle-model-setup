# Contributor-tier pricing: heavily discounted tokens in exchange for
# permission to use prompts and completions to train future Meta models
# (live opencode.ai/docs/go privacy table, verified 2026-09-14: "Model
# training: Yes", "Data retention: Not ZDR"). Availability is limited to
# regions permitted by Meta's Geographic Use Policy — the live "current
# list of models" tags both Contributor rows "(limited regions)". The
# 2026-08-19 narrative source additionally flags this tier with a double
# warning: it trades the same weights as the non-Contributor Muse Spark
# tier for that training grant, is meant only for personal/public
# projects, and has reported reports of poor performance specifically in
# OpenCode (data/sources/perfiles-sdd-opencode-go-only-v2.2.md, section on
# "Muse Spark 1.2 Contributor"). `status: experimental` and an all-zero
# strengths profile (aside from the cap-derived `cheap` axis) follow from
# that evidence, not from a lack of live data — the row is fully published.
# `logRetentionDays: null` reflects "Not ZDR" being a category, not a
# published day count.
id: muse-spark-1.2-contributor
subscription: opencode-go
displayName: Muse Spark 1.2 Contributor
lab: meta
status: experimental
strengths: { oneShotReasoning: 0, sustainedReasoning: 0, codingTools: 0, longContext: 0, multimodal: 0, cheap: 3 }
evidence:
  cheap: >-
    5-hour cap of 45,300 exceeds the subscription's workhorse ceiling of
    5,000 requests/5h, landing in the volume Budget Class tier
    (data/subscriptions/opencode-go.yaml budgetClass.thresholds;
    https://opencode.ai/docs/go, verified 2026-09-14).
privacy: { trainsOnData: true, logRetentionDays: null }
effortVariants: [medium]
plans:
  go:
    requestsPer5h: 45300
    requestsPerWeek: 113300
    requestsPerMonth: 226600
    monthlyUsdBucket: 60
    source: https://opencode.ai/docs/go
    verifiedAt: 2026-09-14
