# OpenCode's runtime mapping: which canonical Gentle AI phases OpenCode's
# live `~/.config/opencode/opencode.json` install carries, what OpenCode
# calls them, and how OpenCode spells subscription provider prefixes.
#
# `agentMap` was re-read (read-only, issue #40) from the `agent` object in
# that config file on 2026-10-06, after the Gentle AI 4.0 release
# (2026-10-01). The config declares more agent keys than 13 (per-budget-tier
# variants suffixed `-oc-go`, `-oc-go-eco`, `-oc-go-hi`, used for the
# maintainer's own model-routing experimentation, not for phase identity),
# so `agentMap` is built from the 14 base agent keys (the ones without a tier
# suffix and without the retired `sdd-` prefix), minus `gentleman`. That
# yields 13 names, each already spelled identically to its canonical phase id
# (identity mapping): every canonical phase.
#
# `gentleman` is excluded: it is OpenCode's primary persona agent and has no
# model of its own, so it is not a Phase (maintainer decision 2026-10-06).
#
# `gentle-orchestrator` is included: OpenCode is the only supported runtime
# where the orchestrator is a configured agent with its own model. In Pi,
# Claude Code, and Codex the orchestrator is the active session model, so
# their mappings carry no entry for it.
#
# `prefixMap` translates `opencode-go` (the one committed subscription's
# `providerPrefix`, data/subscriptions/opencode-go.yaml) as an identity
# mapping — OpenCode is that subscription's own native runtime, so no
# translation is needed, but the spec still requires at least one entry.
id: opencode
displayName: OpenCode
agentMap:
  gentle-orchestrator: gentle-orchestrator
  gentle-ai-explore: gentle-ai-explore
  gentle-ai-verify: gentle-ai-verify
  gentle-ai-worker: gentle-ai-worker
  jd-fix-agent: jd-fix-agent
  jd-judge-a: jd-judge-a
  jd-judge-b: jd-judge-b
  review-readability: review-readability
  review-reliability: review-reliability
  review-resilience: review-resilience
  review-risk: review-risk
  review-refuter: review-refuter
  review-validator: review-validator
prefixMap:
  opencode-go: opencode-go
