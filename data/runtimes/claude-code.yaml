# Claude Code's runtime mapping: which canonical Gentle AI phases Claude
# Code's live `~/.claude/agents/` install carries, what Claude Code calls
# them, and how Claude Code spells subscription provider prefixes.
#
# `agentMap` was re-read (read-only, issue #40) from `~/.claude/agents/` on
# 2026-10-06, after the Gentle AI 4.0 release (2026-10-01). Only the eight
# `*.md` files written by the 4.0 install (mtime 2026-10-04) are mapped:
# one entry per file basename, each an identity mapping to its canonical
# phase id (data/phases/phases.yaml). The `sdd-*.md` files in that directory
# are pre-4.0 leftovers the install preserved; they are not Phases and are
# not mapped. Claude Code's install has no `gentle-orchestrator`,
# `gentle-ai-explore`, `gentle-ai-verify`, `gentle-ai-worker`, or
# `review-validator` file; those canonical phases are simply omitted, which
# the spec states is not a validation error.
#
# `prefixMap` translates `opencode-go` (the one committed subscription's
# `providerPrefix`, data/subscriptions/opencode-go.yaml) as an identity
# mapping — no translation is needed for this runtime today, but the spec
# still requires at least one entry.
id: claude-code
displayName: Claude Code
agentMap:
  jd-fix-agent: jd-fix-agent
  jd-judge-a: jd-judge-a
  jd-judge-b: jd-judge-b
  review-readability: review-readability
  review-refuter: review-refuter
  review-reliability: review-reliability
  review-resilience: review-resilience
  review-risk: review-risk
prefixMap:
  opencode-go: opencode-go
