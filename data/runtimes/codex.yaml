# Codex's runtime mapping: which canonical Gentle AI phases Codex's live
# `~/.codex/agents/` install carries, what Codex calls them, and how Codex
# spells subscription provider prefixes.
#
# PENDING: Codex's install predates Gentle AI 4.0. Its 17 `*.toml` files
# under `~/.codex/agents/` are dated 2026-07-20 and were last read
# (read-only, issue #40) on 2026-10-06. This file therefore awaits a
# `gentle-ai sync` for Codex, after which it must be re-read against 4.0.
# Until then it keeps only the entries of that install that are still
# canonical Phases: every `sdd-*` entry was dropped because SDD was retired
# in 4.0, and the seven remaining files are identity mappings (data/phases/
# phases.yaml). Codex's install has no `gentle-orchestrator`,
# `gentle-ai-explore`, `gentle-ai-verify`, `gentle-ai-worker`,
# `review-refuter`, or `review-validator` file; those canonical phases are
# simply omitted, which the spec states is not a validation error.
#
# `prefixMap` translates `opencode-go` (the one committed subscription's
# `providerPrefix`, data/subscriptions/opencode-go.yaml) as an identity
# mapping — no translation is needed for this runtime today, but the spec
# still requires at least one entry.
id: codex
displayName: Codex
agentMap:
  jd-fix-agent: jd-fix-agent
  jd-judge-a: jd-judge-a
  jd-judge-b: jd-judge-b
  review-readability: review-readability
  review-reliability: review-reliability
  review-resilience: review-resilience
  review-risk: review-risk
prefixMap:
  opencode-go: opencode-go
