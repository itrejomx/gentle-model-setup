# Pi's runtime mapping: which canonical Gentle AI phases Pi's live
# `~/.pi/agent/agents/` install carries, what Pi calls them, and how Pi
# spells subscription provider prefixes.
#
# `agentMap` was re-read (read-only, issue #40) from the 10 `*.md` files
# under `~/.pi/agent/agents/` on 2026-10-06, after the Gentle AI 4.0 release
# (2026-10-01): one entry per file basename, mapped to its canonical phase id
# (data/phases/phases.yaml). Every entry is an identity mapping; the pre-4.0
# `sdd-proposal` alias is gone along with every `sdd-*` agent. Pi's install
# has no `gentle-orchestrator`, `review-refuter`, or `review-validator`
# file; those canonical phases are simply omitted, which the spec states is
# not a validation error.
#
# `prefixMap` translates `opencode-go` (the one committed subscription's
# `providerPrefix`, data/subscriptions/opencode-go.yaml) as an identity
# mapping, plus the design spec's own worked example
# (design.md section 4): `openai` -> `openai-codex`. No
# `data/subscriptions/openai.yaml` (or equivalent) is committed yet — that
# subscription is PRD stories #4-#7 — so this entry documents the design
# spec's illustration rather than a subscription that exists in this
# repository today.
#
# Pending prefix: Pi's live `~/.pi/agent/subagents.json` also routes to the
# `mistral` provider. It is deliberately not mapped here, because every
# `prefixMap` key must be a known Subscription prefix and no Mistral
# Subscription file exists yet (issue #6). Add it once that file lands.
id: pi
displayName: Pi
agentMap:
  gentle-ai-explore: gentle-ai-explore
  gentle-ai-verify: gentle-ai-verify
  gentle-ai-worker: gentle-ai-worker
  jd-fix-agent: jd-fix-agent
  jd-judge-a: jd-judge-a
  jd-judge-b: jd-judge-b
  review-readability: review-readability
  review-reliability: review-reliability
  review-resilience: review-resilience
  review-risk: review-risk
prefixMap:
  opencode-go: opencode-go
  openai: openai-codex
